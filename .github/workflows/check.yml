name: Check offline tools and recorded artifacts
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-11-06
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, verified 2026-11-06
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python experiments/pilot-001/check_code.py
      - run: python experiments/pilot-002/acceptance.py experiments/pilot-002/results/baseline
      - run: python experiments/pilot-002/acceptance.py experiments/pilot-002/results/candidate
